[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[rpc_endpoints]
coston2 = "${COSTON2_RPC_URL}"

[etherscan]
# Coston2's Blockscout instance exposes an Etherscan-compatible API used by
# `forge verify-contract` / `forge script --verify` when --verifier blockscout
# is NOT passed. Kept here so `--etherscan-api-key coston2` resolves an endpoint;
# Blockscout does not require a real API key, any non-empty string works.
coston2 = { key = "${BLOCKSCOUT_API_KEY}", chain = 114, url = "https://coston2-explorer.flare.network/api" }

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
